name: Goosewatch Daily

on:
  schedule:
    # 每天 10:00 UTC+8（即 02:00 UTC）触发
    - cron: "0 2 * * *"
  workflow_dispatch:   # 支持手动触发，调试用

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r goosewatch/requirements.txt

      - name: Run goosewatch
        env:
          FEISHU_APP_ID:      ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:  ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          BITABLE_APP_TOKEN:  ${{ secrets.BITABLE_APP_TOKEN }}
          BITABLE_TABLE_ID:   ${{ secrets.BITABLE_TABLE_ID }}
        run: python -m goosewatch.main
